# registry/sources/provincial_budgets.yaml — one source this project reads (a source card).
# The file name is the source's key; its licence is defined in registry/licences.yaml.

title: Provincial and territorial budget documents, 2026
publisher: Each province and territory's finance department
licence: budget-quotation
# Documents and quotes are declared in registry/budgets.yaml; stage 08
# checks each quote against its document.
#
# Ontario's is the one HTML budget. budget.ontario.ca serves it only to this
# project's user agent (a plain request gets a 403 challenge page), and injects a
# bot-manager token (__uzdbm) that differs on every request: one line of 2,515,
# measured 2026-09-17. So an HTML budget is hashed by its visible text; the PDFs
# are hashed by their bytes, which do not move.
