# registry/datasets/gdp-national-annual-current.yaml - one dataset the pipeline makes (docs/REBUILD.md section 3).
# `python -m atlas.run --dataset gdp-national-annual-current` builds it; atlas/core/registry.py checks every claim below.

title: GDP at basic prices by industry, annual, current dollars (36-10-0710)
group: economy
order: 30
builder: atlas.datasets.statcan_sectors:pull
params:
  pull: national_annual_current
sources:
- statcan_wds
shells:
- fetcher
- statcan_table
after: []
outputs:
- data/sectors/national-annual-current.json
frame:
  profile: panel
  record_type: observation
on_screen: false
consumed_by:
- path: registry/sectors.yaml
  how: the gross output pull takes its sector names from this file; verify/run.py gates every pull this file declares
