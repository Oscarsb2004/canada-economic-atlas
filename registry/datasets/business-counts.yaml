# registry/datasets/business-counts.yaml - one dataset the pipeline makes (docs/REBUILD.md section 3).
# `python -m atlas.run --dataset business-counts` builds it; atlas/core/registry.py checks every claim below.

title: Canadian Business Counts, with employees, by industry, province and size (newest table)
group: business-counts
order: 10
builder: atlas.datasets.business_locations:build
params: {}
sources:
- statcan_business_counts
- statcan_wds
shells:
- fetcher
- statcan_table
- absent_cells
after: []
outputs:
- data/sectors/business-counts.json
frame:
  profile: cross-section
  record_type: observation
on_screen: true
consumed_by:
- path: pipeline/99_bundle.py
  how: copied into the site bundle, web/public/data/
