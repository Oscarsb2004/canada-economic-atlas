# registry/datasets/gdp-national-monthly.yaml - one dataset the pipeline makes (docs/REBUILD.md section 3).
# `python -m atlas.run --dataset gdp-national-monthly` builds it; atlas/core/registry.py checks every claim below.

title: Real GDP by industry, monthly, chained 2017 dollars (36-10-0434)
group: economy
order: 10
builder: atlas.datasets.statcan_sectors:pull
params:
  pull: national_monthly
sources:
- statcan_wds
shells:
- fetcher
- statcan_table
- partition_drift
after: []
outputs:
- data/sectors/national-monthly.json
frame:
  profile: panel
  record_type: observation
on_screen: true
consumed_by:
- path: pipeline/99_bundle.py
  how: copied into the site bundle, web/public/data/
