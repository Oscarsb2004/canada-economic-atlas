# sources.yaml — every external endpoint this project reads, with its licence.
#
# One file so that "where did this come from and may we republish it" has a
# single answer, and so `meta.json` can be generated from data rather than from
# strings pasted into the web app. The app renders attribution from the bundle,
# so a licence can never go stale in the UI while being current here.
#
# `attribution` is the exact wording the licensor asks for. Do not paraphrase it.

licences:
  ogl-canada-2.0:
    name: Open Government Licence – Canada 2.0
    url: https://open.canada.ca/en/open-government-licence-canada
    redistribution: permitted with attribution

  statcan-open:
    name: Statistics Canada Open Licence
    url: https://www.statcan.gc.ca/en/reference/licence
    redistribution: permitted with attribution
    # Required wording differs depending on whether the data was transformed.
    attribution_asis: >-
      Source: Statistics Canada, {product}, {reference_date}. Reproduced and
      distributed on an "as is" basis with the permission of Statistics Canada.
    attribution_adapted: >-
      Adapted from Statistics Canada, {product}, {reference_date}. This does not
      constitute an endorsement by Statistics Canada of this product.

  boc-terms:
    name: Bank of Canada Terms of Use
    url: https://www.bankofcanada.ca/terms/
    redistribution: permitted with attribution
    # Not an open licence — the Bank retains copyright and grants permission.
    # Weaker than OGL, and it requires stating that changes were made.
    attribution: >-
      Source: Bank of Canada. Data used under the Bank of Canada Terms of Use;
      modified from the original.

  aisstream-unstated:
    name: aisstream.io — no published terms of use (checked 2026-09-12)
    url: https://aisstream.io
    redistribution: unstated

sources:
  mpo_arcgis:
    title: Projects and Transformative Strategies Referred to the Major Projects Office
    publisher: Natural Resources Canada
    licence: ogl-canada-2.0
    attribution: Major Projects Office of Canada & Natural Resources Canada
    dataset_record: https://open.canada.ca/data/en/dataset/8f387c74-a5d9-46ec-9aff-32bc8e0ff3b1
    # CKAN metadata_modified on the record above is the change-detection signal.
    ckan_api: https://open.canada.ca/data/en/api/3/action/package_show?id=8f387c74-a5d9-46ec-9aff-32bc8e0ff3b1
    mapserver_en: https://maps-cartes.services.geo.ca/server_serveur/rest/services/NRCan/projects_referred_to_mpo_en/MapServer
    mapserver_fr: https://maps-cartes.services.geo.ca/server_serveur/rest/services/NRCan/projects_referred_to_mpo_fr/MapServer
    layers:
      projects: 1        # 20 features / 18 projects — nctl publishes 3 phase points
      strategies: 2      # 9 features; polygons return EMPTY geometry, attributes only

  mpo_pages:
    title: Major Projects Office project pages
    publisher: Privy Council Office
    licence: ogl-canada-2.0
    attribution: Major Projects Office of Canada
    landing_en: https://www.canada.ca/en/privy-council/major-projects-office.html
    landing_fr: https://www.canada.ca/fr/conseil-prive/bureau-grands-projets.html
    projects_index_en: https://www.canada.ca/en/privy-council/major-projects-office/projects/national.html
    strategies_index_en: https://www.canada.ca/en/privy-council/major-projects-office/projects/other/referred.html

    # The section this event's pages live in. Stage 01 crawls it and reports
    # every group of sibling pages it finds — which is how a category nobody
    # anticipated becomes visible rather than silently uncovered. Reading two
    # named index pages can only confirm the categories you already knew about.
    section_en: /en/privy-council/major-projects-office

    # Which discovered groups carry records, and what each maps to in the
    # bundle. A group found by the crawl that is NOT listed here is reported by
    # verify/ as an undeclared category — that is the seam for a future kind of
    # referred item, and the reason this is a mapping rather than a count.
    #
    # Everything else under the section is prose: about-us, our-priorities,
    # news, contact-us, the Indigenous Advisory Council pages, and the
    # Pathways Plus memorandum of understanding.
    record_groups:
      projects/national: projects
      projects/other/referred: strategies

    # Groups the crawl finds that are known NOT to carry records. Declared so
    # that anything in neither this list nor `record_groups` is a category that
    # appeared since someone last looked — which is the whole signal. Without
    # it every prose page reads as a new category and the check is noise.
    prose_groups:
      - our-priorities
      - partnering-indigenous-peoples
      - partnering-indigenous-peoples/council
      - projects                               # map.html, national.html, other.html
      - projects/other                         # referred.html
      - projects/other/referred/pathways-plus  # its memorandum of understanding

    # Watch item, not a defect of ours. `advancing-nation-building-projects.html`
    # links to `.../projects-designated-under-building-canada-act.html`, which
    # returns 404. "Designated under the Building Canada Act" is a further legal
    # status than "referred to the MPO", so when that page goes live it is a new
    # dataset and not a rename of this one. The crawl records broken links so
    # its appearance is noticed.
    news_index_en: https://www.canada.ca/en/privy-council/major-projects-office/news.html
    # Change detection. NOTE: https://www.canada.ca/en/sitemap.xml is a 404;
    # the index is /sitemap.xml and the PCO namespace is the one below.
    sitemap_en: https://www.canada.ca/en/privy-council.sitemap.xml
    sitemap_fr: https://www.canada.ca/fr/conseil-prive.sitemap.xml
    robots: https://www.canada.ca/robots.txt
    # Single "User-agent: *" block, no Crawl-delay, nothing disallowed on the
    # paths we read. ~1 req/s in atlas/net.py is self-imposed courtesy.

  tc_annual_report:
    title: Transportation in Canada — annual report, Role of Canada's Transportation Network
    publisher: Transport Canada
    licence: ogl-canada-2.0
    attribution: Transport Canada
    # The FR path is DECLARED, not derived — `role-reseau-transport-canadien` is
    # not a transformation of `role-canada-s-transportation-network`. The URLs
    # live in corridors.yaml beside the joins that use them.
    page_en: https://tc.canada.ca/en/corporate-services/transparency/corporate-management-reporting/transportation-canada-annual-reports/transportation-canada-2024/role-canada-s-transportation-network
    # Five corridors, in <details> blocks: Pacific, Prairie, Central, Atlantic,
    # Northern. Each carries a description paragraph and a Marine/Rail/Road/Air
    # infrastructure list. Summaries of this page routinely omit Northern.

  statcan_wds:
    title: Statistics Canada Web Data Service
    publisher: Statistics Canada
    licence: statcan-open
    base: https://www150.statcan.gc.ca/t1/wds/rest/
    docs: https://www.statcan.gc.ca/en/developers/wds/user-guide
    # Keyless. 25 req/s per IP. POST bodies cap at 300 vectors (401+ -> HTTP 416),
    # which is undocumented — but bulk CSV avoids that path entirely.
    vector_batch_max: 300
    tables:
      gdp_monthly:      { pid: 36100434, freq: monthly,   note: "real GDP by industry, chained 2017" }
      gdp_quarterly:    { pid: 36100449, freq: quarterly }
      gdp_annual_pid:   { pid: 36100710, freq: annual,    note: "current dollars; ~3-year lag, ends 2022" }
      gdp_provincial:   { pid: 36100711, freq: annual,    note: "REPLACED the now-inactive 36100402" }
      employment_seph:  { pid: 14100201, freq: monthly,   note: "UNADJUSTED; excludes agriculture ([11N] is forestry only); four sectors under combined codes — pulled via sectors.yaml employment_monthly" }
      revenue_quarterly: { pid: 33100225, freq: quarterly, note: "NOT revenue by industry: non-financial balance sheets and income statements, enterprise groups that do not join the 20-sector key. Not pulled — BACKLOG B2a" }
      capex_annual:     { pid: 34100035, freq: annual,    note: "latest 2 years are preliminary actuals and intentions, flagged only in a note; STATUS mixes suppression with quality A-F" }
      output_annual:    { pid: 36100488, freq: annual,    note: "gross output by IOIC industry and institutional sector (BS/NP/GS), NOT NAICS; summed to sectors by a derived crosswalk in sectors.yaml" }

  boc_valet:
    title: Bank of Canada Valet API
    publisher: Bank of Canada
    licence: boc-terms
    base: https://www.bankofcanada.ca/valet/
    # NOTE: the group list route is /valet/lists/groups/json.
    # /valet/groups/json is a 404.
    series:
      policy_rate: V39079
      cpi_total: V41690973
      cpi_trim: CPI_TRIM
      cpi_median: CPI_MEDIAN
      cpi_common: CPI_COMMON
    groups:
      fx_daily: FX_RATES_DAILY

  statcan_business_counts:
    title: Canadian Business Counts, with employees
    publisher: Statistics Canada
    licence: statcan-open
    attribution: Statistics Canada, Canadian Business Counts, with employees
    # A new table every six months (33101174 for June 2026); stage 03 finds the
    # newest by its exact title rather than declaring a product ID here.
    # Replaces the removed BlackRock company panel (CLAUDE.md §9).

  geogratis_names:
    title: Canadian Geographical Names Database
    publisher: Natural Resources Canada
    licence: ogl-canada-2.0
    base: https://geogratis.gc.ca/services/geoname/en/geonames.geojson
    # Only used if a news release names a place with no published coordinate.
    # Every MPO project already carries official coordinates, so this is unused
    # by stage 01 today.

  canada_placenames:
    title: Geolocated placenames in Canada
    publisher: Innovation, Science and Economic Development Canada
    licence: ogl-canada-2.0
    attribution: Innovation, Science and Economic Development Canada — Geolocated placenames in Canada
    dataset_record: https://open.canada.ca/data/en/dataset/fe945388-1dd9-4a4a-9a1e-5c552579a28c
    csv: https://ised-isde.canada.ca/app/scr/sittibc/web/api/openData/MAG_EXO.CSV
    # City, town, village, First Nations community and small-hamlet points.
    # Geometry is built separately by scripts/build_geo.mjs because it is map
    # reference data, not an event or an economic series.

  statcan_boundaries:
    title: 2021 Census cartographic boundary files — provinces and territories
    publisher: Statistics Canada
    licence: statcan-open
    dataset_record: https://open.canada.ca/data/en/dataset/ef70dc3b-1069-4037-9bce-61f47e628a1d

  statcan_population_centres:
    title: Population and dwelling counts — Canada and population centres
    publisher: Statistics Canada
    licence: statcan-open
    attribution: Statistics Canada, 2021 Census population centres
    dataset_record: https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=9810001101
    csv: https://www150.statcan.gc.ca/n1/en/tbl/csv/98100011-eng.zip
    # Population centres (1,000+ people) rank the map labels. Smaller official
    # placenames remain searchable/labelled only at closer zoom levels.

  statcan_municipal_population:
    title: Population and dwelling counts — census subdivisions (municipalities)
    publisher: Statistics Canada
    licence: statcan-open
    attribution: Statistics Canada, 2021 Census of Population
    dataset_record: https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=9810000201
    csv: https://www150.statcan.gc.ca/n1/en/tbl/csv/98100002-eng.zip
    csv_fr: https://www150.statcan.gc.ca/n1/fr/tbl/csv/98100002-fra.zip
    census_vintage: "2021"
    # What one read of the 2021 table contains. Stage 05 stops before writing if
    # these move, and registry/checks.yaml gates the subdivision count through
    # `expect_from`, so a new census is one reviewed edit here.
    expected:
      census_subdivisions: 5161
      census_divisions: 293
      provinces_and_territories: 13
    # TWO CONSUMERS, TWO PARSERS — for now.
    #
    # scripts/build_geo.mjs reads the English file as the FALLBACK rank for place
    # labels. Population centres are agglomerations, so Ottawa, Mississauga,
    # Brampton, Surrey, Laval and Gatineau have no centre of their own name; the
    # municipality is the published figure for the place.
    #
    # pipeline/05_municipalities.py reads both languages into Municipality
    # records. BACKLOG M1 makes the build read that output instead, so one parser
    # decides what a subdivision's population is.

  statcan_naics_2022:
    title: North American Industry Classification System (NAICS) Canada 2022 Version 1.0
    publisher: Statistics Canada
    licence: statcan-open
    attribution: Statistics Canada, North American Industry Classification System (NAICS) Canada 2022 Version 1.0
    dataset_record: https://open.canada.ca/data/en/dataset/980d598c-73c9-4003-b6e1-78a9a3081b6c
    structure_en: https://www.statcan.gc.ca/eng/statistical-programs/document/naics-scian-2022-structure-v1-eng.csv
    structure_fr: https://www.statcan.gc.ca/fra/programmes-statistiques/document/naics-scian-2022-structure-v1-fra.csv
    elements_en: https://www.statcan.gc.ca/eng/statistical-programs/document/naics-scian-2022-element-v1-eng.csv
    elements_fr: https://www.statcan.gc.ca/fra/programmes-statistiques/document/naics-scian-2022-element-v1-fra.csv
    # Stage 06 checks every quote in registry/mpo_naics.yaml against these four
    # files. The French element file is sorted by its own wording, not in the
    # English file's order — see atlas/sources/naics.py.

  nrcan_mpi_2025:
    title: Major Projects Inventory 2025
    publisher: Natural Resources Canada
    licence: ogl-canada-2.0
    attribution: Natural Resources Canada — Major Projects Inventory 2025
    xlsx: https://ftp.maps.canada.ca/pub/nrcan_rncan/Natural-resources_Ressources-naturelles/major_projects_inventory/MPI_2025_Active_Projects_en.xlsx
    sheet: MPI 2025 Data
    xlsx_fr: https://ftp.maps.canada.ca/pub/nrcan_rncan/Natural-resources_Ressources-naturelles/major_projects_inventory/MPI_2025_Active_Projects_fr.xlsx
    sheet_fr: Données IGP 2025
    status_field: Status 2025
    prior_status_field: Status 2024
    # Read for construction status only (BACKLOG C1). Its cost columns are C2,
    # and must not render before C3 states how few MPO projects have one.

  tc_large_vessel_register:
    title: Canadian Register of Large Vessels
    publisher: Transport Canada
    licence: ogl-canada-2.0
    attribution: Transport Canada — Canadian Register of Large Vessels
    dataset_record: https://open.canada.ca/data/en/dataset/bf00b7f4-e370-46b7-94e4-0bdedc98531b
    xlsx_en: https://opendatatc.tc.canada.ca/large-vessel-registry_dataset_en.xlsx
    xlsx_fr: https://opendatatc.tc.canada.ca/large-vessel-registry_dataset_fr.xlsx
    # The identity half of the vessel layer (BACKLOG S1, docs/AIS.md). No MMSI
    # and no call sign are published; IMO is the only key AIS shares. Updated
    # "continually", so stage 07 re-reads it only with --refresh.

  aisstream:
    title: aisstream.io live AIS relay
    publisher: aisstream.io
    licence: aisstream-unstated
    attribution: Vessel positions relayed by aisstream.io
    stream: wss://stream.aisstream.io/v0/stream
    documentation: https://aisstream.io/documentation
    message_models: https://github.com/aisstream/ais-message-models
    # Canada's Maritime Identification Digits, allocated by the ITU. The
    # Canadian Coast Guard's Radio Aids to Marine Navigation uses 316010115 as
    # its worked example of a Canadian ship's MMSI.
    canadian_mids: ["316"]
    # Not a government source, chosen 2026-09-12 because none publishes live
    # positions. Shore-based receivers only: open-ocean positions are not heard.

  nrcan_nrwn:
    title: National Railway Network (NRWN) — GeoBase Series
    publisher: Natural Resources Canada
    licence: ogl-canada-2.0
    attribution: Natural Resources Canada — National Railway Network (NRWN)
    dataset_record: https://open.canada.ca/data/en/dataset/ac26807e-a1e8-49fa-87bf-451175a859b8
    distribution: https://ftp.maps.canada.ca/pub/nrcan_rncan/vector/geobase_nrwn_rfn/
    # The publisher distributes regional Shapefile archives. Track Segment is
    # the only feature class rendered; its official Track Classification,
    # Owner and Operator attributes remain with each output feature.
