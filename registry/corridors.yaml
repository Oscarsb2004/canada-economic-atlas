# corridors.yaml — the joins for Transport Canada's national trade corridors.
#
# WHAT IS HERE AND WHAT IS NOT
#
# The corridors' NAMES, DESCRIPTIONS and INFRASTRUCTURE LISTS are not in this
# file. They are scraped verbatim from Transport Canada's annual report by
# `atlas/sources/tc_corridors.py`. This file carries only the JOINS — which
# summary text identifies which corridor, which provinces we read it as
# covering, and where its named ports and border crossings actually are.
#
# Everything in this file is therefore `Provenance.DERIVED`: it is our reading
# of Transport Canada's prose, and the UI must never render it with the same
# authority as the prose itself.
#
# THE NUMBERS STAY IN THE PARAGRAPH
#
# TC's text says $249 billion, 158 million tonnes, 55% crude by pipeline. There
# is deliberately NO `stats:` block here. Lifting a figure out of a federal
# sentence into a field would be this project restating a claim in a form the
# source never used (CLAUDE.md §1), and it is the single most likely thing for a
# later session to "improve" by adding. The corridor's paragraph carries the
# numbers Transport Canada published; the charts carry the numbers StatCan
# published; nothing crosses.
#
# THERE ARE FIVE CORRIDORS
#
# Pacific, Prairie, Central, Atlantic and NORTHERN. Summaries of the source page
# routinely list four. Missing one would be invisible — four would still sum to
# something and still draw something — so the count is asserted in `events.yaml`
# and gated.
#
# THE FIVE ARE NOT A PARTITION OF THE PROVINCES
#
# The Northern Corridor is defined by LATITUDE — "regions north of 55 degrees" —
# while the other four are described by province. Northern British Columbia is
# therefore in both the Pacific and the Northern corridor, and that overlap is
# Transport Canada's framing, not a mistake in ours. The loader must NOT
# validate these as mutually exclusive. Only the three territories map cleanly
# to Northern; the provincial portions above 55° are recorded as unmapped rather
# than guessed at.

version: 2
provenance: derived

# The source page, in both languages. The FR path is DECLARED, never derived:
# `role-reseau-transport-canadien` is not a transformation of
# `role-canada-s-transportation-network`, and a rule that produced one from the
# other would be a rule that breaks on the next page.
source:
  key: tc_annual_report
  page_en: https://tc.canada.ca/en/corporate-services/transparency/corporate-management-reporting/transportation-canada-annual-reports/transportation-canada-2024/role-canada-s-transportation-network
  page_fr: https://tc.canada.ca/fr/services-generaux/transparence/gestion-rapports-ministeriels/rapports-annuels-transports-canada/transports-canada-2024/role-reseau-transport-canadien

# ── Nodes ──────────────────────────────────────────────────────────────────────
#
# Coordinates are the harbour or the crossing, to the nearest minute. The PLACES
# are real and the coordinates are ours; Transport Canada names these facilities
# in each corridor's infrastructure list but publishes no geometry for them.

ports:
  - { id: vancouver,      name: { en: "Port of Vancouver",      fr: "Port de Vancouver" },      coord: [-123.11, 49.29] }
  - { id: prince-rupert,  name: { en: "Port of Prince Rupert",  fr: "Port de Prince Rupert" },  coord: [-130.32, 54.32] }
  - { id: nanaimo,        name: { en: "Port of Nanaimo",        fr: "Port de Nanaimo" },        coord: [-123.94, 49.17] }
  - { id: port-alberni,   name: { en: "Port Alberni",           fr: "Port Alberni" },           coord: [-124.80, 49.23] }
  - { id: thunder-bay,    name: { en: "Port of Thunder Bay",    fr: "Port de Thunder Bay" },    coord: [-89.25, 48.38] }
  - { id: churchill,      name: { en: "Port of Churchill",      fr: "Port de Churchill" },      coord: [-94.17, 58.77] }
  - { id: toronto,        name: { en: "Port of Toronto",        fr: "Port de Toronto" },        coord: [-79.36, 43.64] }
  - { id: hamilton-oshawa, name: { en: "Port of Hamilton-Oshawa", fr: "Port de Hamilton-Oshawa" }, coord: [-79.85, 43.27] }
  - { id: montreal,       name: { en: "Port of Montreal",       fr: "Port de Montréal" },       coord: [-73.52, 45.55] }
  - { id: quebec,         name: { en: "Port of Québec",         fr: "Port de Québec" },         coord: [-71.20, 46.82] }
  - { id: halifax,        name: { en: "Port of Halifax",        fr: "Port d'Halifax" },         coord: [-63.57, 44.65] }
  - { id: saint-john,     name: { en: "Port of Saint John",     fr: "Port de Saint John" },     coord: [-66.06, 45.27] }
  - { id: belledune,      name: { en: "Port of Belledune",      fr: "Port de Belledune" },      coord: [-65.84, 47.90] }
  - { id: st-johns,       name: { en: "Port of St. John's",     fr: "Port de St. John's" },     coord: [-52.70, 47.56] }

crossings:
  - { id: pacific-highway, name: { en: "Pacific Highway",  fr: "Pacific Highway" },  coord: [-122.73, 49.00] }
  - { id: huntingdon,      name: { en: "Huntingdon",       fr: "Huntingdon" },       coord: [-122.27, 49.00] }
  - { id: coutts,          name: { en: "Coutts",           fr: "Coutts" },           coord: [-111.96, 49.00] }
  - { id: north-portal,    name: { en: "North Portal",     fr: "North Portal" },     coord: [-102.55, 49.00] }
  - { id: emerson,         name: { en: "Emerson",          fr: "Emerson" },          coord: [-97.21, 49.00] }
  - { id: ambassador,      name: { en: "Ambassador Bridge", fr: "Pont Ambassador" }, coord: [-83.07, 42.31] }
  - { id: bluewater,       name: { en: "Blue Water Bridge", fr: "Pont Blue Water" }, coord: [-82.42, 42.99] }
  - { id: peace,           name: { en: "Peace Bridge",      fr: "Pont Peace" },      coord: [-78.91, 42.91] }
  - { id: woodstock,       name: { en: "Woodstock",        fr: "Woodstock" },        coord: [-67.73, 46.10] }
  - { id: st-stephen,      name: { en: "St. Stephen",      fr: "St. Stephen" },      coord: [-67.29, 45.19] }

# ── The corridors ──────────────────────────────────────────────────────────────
#
# `summary` is the join key into the scraped page — the exact `<summary>` text,
# in both languages, read off the live pages. A wrong string here does not
# degrade: `tc_corridors.parse_page` raises naming what it could not find.
#
# ⚠ PROVINCE CODES ARE QUOTED. YAML 1.1 reads a bare `ON` as the boolean `true`,
# so an unquoted `[ON, QC]` loads as `[True, "QC"]` and Ontario vanishes from the
# Central Corridor — taking 70% of Canada's manufacturing GDP with it, silently.
# `registry.py` rejects non-string codes with an explanatory error.

corridors:
  - id: pacific
    summary: { en: "Pacific Corridor", fr: "Corridor du Pacifique" }
    provinces: ["BC"]
    location_verbatim:
      en: "the gateway for Canada's trade and transportation with the Asia-Pacific region"
      fr: "un point de passage pour les échanges commerciaux et le transport du Canada avec la région de l'Asie-Pacifique"
    ports: [vancouver, prince-rupert, nanaimo, port-alberni]
    crossings: [pacific-highway, huntingdon]

  - id: prairie
    summary: { en: "Prairie Corridor", fr: "Corridor des Prairies" }
    provinces: ["AB", "SK", "MB"]
    location_verbatim:
      en: "encompassing the provinces of Alberta, Saskatchewan and Manitoba"
      fr: "qui englobe les provinces de l'Alberta, de la Saskatchewan et du Manitoba"
    ports: [churchill, thunder-bay]
    crossings: [coutts, north-portal, emerson]

  - id: central
    summary: { en: "Central Corridor", fr: "Corridor du Centre" }
    provinces: ["ON", "QC"]
    location_verbatim:
      en: "spans Ontario and Quebec"
      fr: "s'étend sur l'Ontario et le Québec"
    ports: [toronto, hamilton-oshawa, montreal, quebec]
    crossings: [ambassador, bluewater, peace]

  - id: atlantic
    summary: { en: "Atlantic Corridor", fr: "Corridor Atlantique" }
    provinces: ["NB", "NS", "PE", "NL"]
    location_verbatim:
      en: "encompasses the transportation networks of the Atlantic provinces"
      fr: "englobe les réseaux de transport des provinces de l'Atlantique"
    ports: [halifax, saint-john, belledune, st-johns]
    crossings: [woodstock, st-stephen]

  - id: northern
    summary: { en: "Northern Corridor", fr: "Corridor du Nord" }
    # ONLY the territories. The Northern Corridor is defined by latitude, so it
    # also covers the parts of BC, AB, SK, MB, ON, QC and NL above 55°N — which
    # this project does not have the geometry to express and will not guess at.
    # `unmapped_note` says so rather than leaving the omission silent.
    provinces: ["YT", "NT", "NU"]
    overlaps_provinces: true
    unmapped_note:
      en: >
        Transport Canada defines this corridor by latitude — regions north of
        55 degrees — not by province. Only the three territories are mapped
        here. The portions of British Columbia, Alberta, Saskatchewan, Manitoba,
        Ontario, Quebec and Newfoundland and Labrador above that line are part
        of this corridor and are not shown.
      fr: >
        Transports Canada définit ce corridor par la latitude — les régions au
        nord du 55e degré — et non par province. Seuls les trois territoires
        sont représentés ici.
    location_verbatim:
      en: "spans regions north of 55 degrees"
      fr: "s'étend sur les régions situées au nord du 55e parallèle"
    ports: [churchill]
    crossings: []
