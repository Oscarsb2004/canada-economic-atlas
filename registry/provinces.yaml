# provinces.yaml — the thirteen provinces and territories, and where each one's
# deep-dive sources are (BACKLOG Stage R).
#
# Codes are the atlas's own (`registry.PROVINCE_CODES`); `pruid` is Statistics
# Canada's, as the boundary file and every cube's DGUID carry it.
#
# fiscal_table   Finance Canada's Fiscal Reference Tables number for the
#                jurisdiction — its sheet in both workbooks starts with it.
# heritage       Canadian Heritage's page names, which differ by language
#                ("colombie-britannique"); read 2026-09-13 from each English
#                page's own hreflang link.
# flag, arms     Wikimedia Commons file titles, chosen 2026-09-13 on the owner's
#                decision to take flag and coat-of-arms images from Commons.
#                Each file's own licence, artist and Commons restrictions are
#                read at build time and published beside the image — flags are
#                public domain; several arms drawings are CC BY-SA and must
#                credit their artist.

version: 1
# Keys are quoted: YAML 1.1 reads a bare ON as the boolean true (CLAUDE.md).
fiscal_source: finance_fiscal_reference_tables
shares_source: statcan_gdp_shares_provincial
symbols_source: pch_provincial_symbols
images_source: wikimedia_commons

provinces:
  "NL":
    pruid: "10"
    fiscal_table: 18
    heritage: {en: newfoundland-and-labrador, fr: terre-neuve-et-labrador}
    flag: "File:Flag of Newfoundland and Labrador.svg"
    arms: "File:Coat of Arms of Newfoundland and Labrador.svg"
