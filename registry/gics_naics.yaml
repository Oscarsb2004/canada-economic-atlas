# gics_naics.yaml — GICS (market data) to NAICS (national accounts).
#
# THIS MAPPING IS LOSSY AND IT IS OURS, NOT ANYONE'S OFFICIAL POSITION.
#
# It exists because the two halves of the app speak different languages. Sector
# GDP comes from Statistics Canada keyed on NAICS; the company panel comes from
# index holdings keyed on GICS. There is no official free crosswalk between
# them, and no exact one is possible: GICS classifies a COMPANY by where it
# makes its money, NAICS classifies an ESTABLISHMENT by what it produces, so a
# diversified firm lands in one GICS bucket and several NAICS ones.
#
# The mapping therefore lives here as a reviewable artifact rather than inside
# a function, every entry is `Provenance.DERIVED`, and the UI never presents it
# as a statement by StatCan or by the index provider.
#
# `primary` is the single NAICS code used when one must be chosen (filtering the
# company panel by the selected sector). `also` records the other sectors the
# GICS bucket genuinely spans, so the loss is visible instead of silent.
#
# The two worst splits, called out because they are where this mapping misleads
# most: Materials spans mining (21) and manufacturing (31-33) with no way to
# tell which from the holdings file alone; Communication spans information and
# cultural industries (51) and arts and entertainment (71).

version: 1
source_vocabulary: GICS sectors as published in the iShares XIC holdings file
target_vocabulary: NAICS 2-digit, as coded by StatCan cube 36100434

map:
  - gics: Energy
    primary: "21"                 # Mining, quarrying, and oil and gas extraction
    also: ["48-49"]               # pipeline transportation sits in 486
    note: Canadian "Energy" is dominated by oil and gas extraction plus pipelines.

  - gics: Materials
    primary: "21"
    also: ["31-33"]
    note: >-
      The worst split in this table. Metal miners belong in 21; fertiliser,
      packaging and chemical producers belong in 31-33. The holdings file gives
      no field that separates them, so the primary follows the Canadian index's
      composition, which is mining-heavy.

  - gics: Industrials
    primary: "31-33"              # Manufacturing
    also: ["23", "48-49", "56"]   # construction, transport, support services
    note: Spans manufacturers, railways, engineering and waste services.

  - gics: Financials
    primary: "52"                 # Finance and insurance
    also: []

  - gics: Real Estate
    primary: "53"                 # Real estate and rental and leasing
    also: []

  - gics: Utilities
    primary: "22"                 # Utilities
    also: []

  - gics: Information Technology
    primary: "51"                 # Information and cultural industries
    also: ["54", "31-33"]         # software services; hardware manufacturing
    note: >-
      NAICS has no "technology" sector. Software publishing is in 51, IT
      services in 54, hardware in 334 under 31-33.

  - gics: Communication
    primary: "51"
    also: ["71"]                  # arts, entertainment and recreation
    note: Telecoms and broadcasters in 51; media and entertainment reach into 71.

  - gics: Consumer Discretionary
    primary: "44-45"              # Retail trade
    also: ["72", "71", "31-33"]

  - gics: Consumer Staples
    primary: "44-45"
    also: ["31-33"]               # food and beverage manufacturing
    note: Grocers are retail; food processors are manufacturing.

  - gics: Health Care
    primary: "62"                 # Health care and social assistance
    also: ["31-33"]               # pharmaceutical manufacturing
    note: >-
      Listed Canadian health care is mostly pharma and devices, which are
      manufacturing. NAICS 62 is care delivery, which is largely public and
      barely listed. This is the mapping whose primary is least representative
      of what the companies actually do.

# Rows carrying these GICS values are not companies and are dropped by
# 03_companies.py before the crosswalk is applied.
not_sectors:
  - Cash and/or Derivatives
