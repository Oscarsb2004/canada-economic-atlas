# registry/shells/partition_drift.yaml - the card for one shell (docs/REBUILD.md section 2.3).
# atlas/core/registry.py checks that its module, functions, users and tests exist.

kind: check
module: atlas.shells.check.partition_drift
title: How far a set of parts is from its whole
contract: At the latest period where the total and every part publish a value, the percentage by which the parts
  miss the total.
functions:
- latest_drift
invariants:
- Series are aligned by period, never by position.
refusals: []
benchmark:
- 'Golden master: stage 02 replays identically.'
tests:
- tests/test_shells_transform_check.py::test_drift_is_read_at_the_latest_period_all_publish
limits:
- An early look inside the stage; verify/ gates the identity on the published files.
gotchas:
- 'Chained dollars are not additive: goods plus services drift +0.311% from all industries.'
used_by:
- atlas/datasets/statcan_sectors.py
moved_from:
- pipeline/02_sectors.py
