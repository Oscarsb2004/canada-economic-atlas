# registry/shells/fetcher.yaml - the card for one shell (docs/REBUILD.md section 2.3).
# atlas/core/registry.py checks that its module, functions, users and tests exist.

kind: acquire
module: atlas.shells.acquire.fetcher
title: Polite, cached HTTP for every request the pipeline makes
contract: Given a URL, return its body as bytes, text or JSON, or write it to a path; POST JSON and parse the answer.
  Every outbound request in the project goes through here.
functions:
- Fetcher
- FetchError
invariants:
- At most one request a second to the same host.
- A cached body older than 24 hours is a miss, so change detection keeps working.
- POST answers are never cached; the cache is keyed on URL alone.
- TLS verification stays on.
refusals:
- 403 and 404 fail at once rather than being retried.
- A transient status (429, 5xx, 520-524) is retried three times with backoff, then fails.
benchmark:
- 'Golden master: every recorded exchange replays through it.'
tests:
- tests/test_pipeline.py::test_cache_entries_expire
limits:
- Not for live streams; aisstream.io is a WebSocket (live/collect_ais.py).
gotchas:
- canada.ca was observed taking over 45 seconds to first byte, hence the long read timeout.
- An immortal cache silently turned change detection off; entries now expire.
used_by:
- atlas/datasets/major_projects.py
- atlas/datasets/statcan_sectors.py
- atlas/datasets/trade_corridors.py
- atlas/datasets/project_industries.py
- atlas/datasets/province_profiles.py
- atlas/run.py
moved_from:
- atlas/net.py
