# registry/shells/verbatim_quotes.yaml - the card for one shell (docs/REBUILD.md section 2.3).
# atlas/core/registry.py checks that its module, functions, users and tests exist.

kind: check
module: atlas.shells.check.verbatim_quotes
title: Every quote is in its document, where it says it is
contract: Given quotes with page locators and a document's normalised pages or text, raise unless each quote is
  found where its locator says.
functions:
- check
- QuoteError
invariants:
- Quote and document are normalised the same way.
refusals:
- A page number outside the document.
- A quote not found at its locator.
benchmark:
- 'Golden master: stage 08 replays identically (13 budget quotes at legacy-v1).'
tests:
- tests/test_pipeline.py::test_budget_quotes_must_be_on_their_stated_page
- tests/test_shells_transform_check.py::test_a_quote_on_the_wrong_page_raises_the_callers_error
limits:
- Forgives only extraction artefacts; a changed word fails.
gotchas:
- Prince Edward Island's budget page refuses automated reading, so it carries no quote.
used_by:
- atlas/readers/budget_text.py
moved_from:
- atlas/readers/budget_text.py
