# sectors.yaml — the main groupings of the Canadian economy.
#
# This file lists CODES and their grouping. It deliberately does NOT list
# labels: those come from the StatCan cube itself, which embeds the code in the
# industry name ("Manufacturing [31-33]"). Carrying our own labels would let the
# UI drift from the source, which is exactly what the project's governing rule
# forbids. English and French labels both arrive from the -eng and -fra cubes.
#
# The partition that matters:
#
#     T002 (goods) + T003 (services) == T001 (all industries), exactly.
#
# That identity is what makes a two-series composition chart legal. With 20
# two-digit sectors, a stacked area would need 20 categorical hues, which is
# past every colour-safety floor — so the 20 are shown as a one-hue ranking, as
# small multiples, or via emphasis, and the stacked view uses this pair.
#
# Everything under `cross_cuts` OVERLAPS. Energy includes parts of Mining,
# Utilities and Manufacturing; ICT spans Manufacturing and Information. They are
# alternate lenses on the same economy and MUST NOT be summed or stacked.

aggregates:
  total: T001            # All industries
  partition:             # these two sum to `total`
    - T002               # Goods-producing industries
    - T003               # Services-producing industries

cross_cuts:              # overlapping lenses — never summed, never stacked
  - T004                 # Business sector industries
  - T007                 # Non-business sector industries
  - T010                 # Industrial production
  - T011                 # Non-durable manufacturing
  - T012                 # Durable manufacturing
  - T013                 # Information and communication technology sector
  - T016                 # Energy sector
  - T018                 # Public sector

# The 20 two-digit NAICS sectors, exactly as the cube codes them.
# `parent` is the partition member each belongs to.
sectors:
  - { code: "11",    parent: T002 }   # Agriculture, forestry, fishing and hunting
  - { code: "21",    parent: T002 }   # Mining, quarrying, and oil and gas extraction
  - { code: "22",    parent: T002 }   # Utilities
  - { code: "23",    parent: T002 }   # Construction
  - { code: "31-33", parent: T002 }   # Manufacturing
  - { code: "41",    parent: T003 }   # Wholesale trade
  - { code: "44-45", parent: T003 }   # Retail trade
  - { code: "48-49", parent: T003 }   # Transportation and warehousing
  - { code: "51",    parent: T003 }   # Information and cultural industries
  - { code: "52",    parent: T003 }   # Finance and insurance
  - { code: "53",    parent: T003 }   # Real estate and rental and leasing
  - { code: "54",    parent: T003 }   # Professional, scientific and technical services
  - { code: "55",    parent: T003 }   # Management of companies and enterprises
  - { code: "56",    parent: T003 }   # Administrative and support, waste management
  - { code: "61",    parent: T003 }   # Educational services
  - { code: "62",    parent: T003 }   # Health care and social assistance
  - { code: "71",    parent: T003 }   # Arts, entertainment and recreation
  - { code: "72",    parent: T003 }   # Accommodation and food services
  - { code: "81",    parent: T003 }   # Other services (except public administration)
  - { code: "91",    parent: T003 }   # Public administration

# Every cube this project pulls, and which slice of it. `pipeline/02_sectors.py`
# runs these in order; `verify/run.py` gates every pull that declares `verify`.
#
#   output          the file written under data/sectors/
#   filters         column -> the one member kept
#   stream          read the CSV row by row rather than whole (SEPH is ~1 GB)
#   code_aliases    a code as published -> the key above; renames, never merges
#   extra_codes     codes kept beyond the taxonomy, such as the cube's own aggregates
#   absent_codes    sector codes the cube does not publish, each with its reason
#   keep_status     carry the STATUS column (suppression, quality A–F) beside values
#   period_basis    label the latest periods, from one of the cube's own notes
#   verify          identities and tolerances, every one measured before it was set
#
# The monthly GDP cube is Canada-only and its Prices dimension has exactly two
# members, both constant-price — there is no current-dollar monthly GDP by
# industry, so nominal comes from the annual cube with its ~3-year lag.
pulls:
  national_monthly:
    pid: "36100434"
    output: national-monthly.json
    frequency: monthly
    measure: gdp_chained
    partition_check: true
    filters:
      GEO: "Canada"
      Seasonal adjustment: "Seasonally adjusted at annual rates"
      Prices: "Chained (2017) dollars"

  # Same cube, additive price basis. Chained dollars are NOT additive — the cube
  # footnote says so outright — so any view where components must sum to their
  # aggregate reads this series instead.
  national_monthly_constant:
    pid: "36100434"
    output: national-constant.json
    frequency: monthly
    measure: gdp_constant
    partition_check: true
    filters:
      GEO: "Canada"
      Seasonal adjustment: "Seasonally adjusted at annual rates"
      Prices: "2017 constant prices"

  # ── B2 ─────────────────────────────────────────────────────────────────────
  #
  # BACKLOG B2 called these "registry entries, not new code". Every claim below
  # was read off the downloaded cube on 2026-09-10, before it was written here.

  # "Gross domestic product (GDP) at basic prices, by industry" — CURRENT
  # dollars, verified rather than assumed from the product id: its 2022 total
  # is $2,674,953M against $2,206,344M chained. Canada only, 1997–2022.
  national_annual_current:
    pid: "36100710"
    output: national-annual-current.json
    frequency: annual
    measure: gdp_current
    filters:
      GEO: "Canada"
    verify:
      # Current dollars ARE additive. Measured worst over 26 years: 0.00011%
      # for goods + services, 0.00021% for the twenty sectors.
      identities:
        - { parts: [T002, T003], total: T001, tolerance_pct: 0.01 }
        - parts: ["11", "21", "22", "23", "31-33", "41", "44-45", "48-49", "51", "52",
                  "53", "54", "55", "56", "61", "62", "71", "72", "81", "91"]
          total: T001
          tolerance_pct: 0.01

  # "Capital and repair expenditures, non-residential tangible assets, by
  # industry and geography" — annual from 2006, Canada and every province.
  #
  # Its total, "All Industries", is published WITHOUT a code, so no T001 exists
  # here and none is invented. The twenty sectors do not sum to that total
  # either: wherever a sector is suppressed the gap reaches 1.39%.
  capex_annual:
    pid: "34100035"
    output: capex-annual.json
    frequency: annual
    measure: capex
    keep_status: true
    filters:
      Capital and repair expenditures: "Capital expenditures"
    period_basis:
      note_contains: "Most recent 2 years of data are preliminary actuals and intentions"
      latest: [preliminary_actual, intentions]
    verify:
      provinces: true
      # Measured: 0.046% worst over the 137 year-and-sector pairs where no
      # province is suppressed. A suppressed cell makes a year incomparable,
      # never zero.
      provinces_sum_to_canada: { tolerance_pct: 0.1 }

  # "Employment by industry, monthly, unadjusted for seasonality" (SEPH) —
  # all employees, 2001-01 onward, Canada and every province.
  #
  # NOT seasonally adjusted, while GDP is adjusted at annual rates: a month of
  # one against a month of the other measures the season. Hence `employment_nsa`.
  # Productivity wants annual averages, or a seasonally adjusted SEPH table.
  employment_monthly:
    pid: "14100201"
    output: employment-monthly.json
    frequency: monthly
    measure: employment_nsa
    stream: true
    keep_status: true
    filters:
      Type of employee: "All employees"
    # Four sectors are published under combined codes — a two-digit sector with
    # its only subsector. Renamed onto the key; the build refuses to merge two.
    code_aliases:
      "22,221": "22"
      "54,541": "54"
      "55,551,5511": "55"
      "61,611": "61"
    # SEPH's own aggregates, kept so its partition can be gated. They are NOT
    # T001/T002/T003: SEPH excludes agriculture, fishing and trapping, private
    # households, religious organisations and the military.
    extra_codes: ["11N", "11-33N", "41-91N", "11-91N", "00-91N", "00"]
    absent_codes:
      "11": >
        SEPH excludes agriculture. Its "Forestry, logging and support [11N]" is
        forestry alone, and joining it to NAICS 11 would divide
        agriculture-plus-forestry GDP by forestry jobs.
    verify:
      provinces: true
      identities:
        # Measured exact at 2026-06 once 55 is aliased; without it services
        # fell 123,578 employees short.
        - { parts: ["11N", "21", "22", "23", "31-33"], total: "11-33N", tolerance_pct: 0.001 }
        - parts: ["41", "44-45", "48-49", "51", "52", "53", "54", "55", "56", "61", "62",
                  "71", "72", "81", "91"]
          total: "41-91N"
          tolerance_pct: 0.001
        - { parts: ["11-33N", "41-91N"], total: "11-91N", tolerance_pct: 0.001 }
        - { parts: ["11-91N", "00"], total: "00-91N", tolerance_pct: 0.001 }
      # Measured: 0.003% worst at 2026-06 over the 44 industries with no
      # province suppressed.
      provinces_sum_to_canada: { tolerance_pct: 0.05 }

  # "Output, by sector and industry, provincial and territorial" — gross output
  # at basic prices, current dollars, 1997–2022: the same accounts and years as
  # the nominal GDP above. BACKLOG B2a, option A, chosen 2026-09-11.
  #
  # NOT CLASSIFIED BY NAICS. It uses the Input-Output Industry Classification
  # (IOIC) and splits every industry by institutional sector — business (BS),
  # non-profit institutions serving households (NP), government (GS). No member
  # is "NAICS 61": education is BS610 + NP61000 + GS610. So the twenty sectors
  # below are a CROSSWALK. Each member is assigned by the NAICS code it embeds
  # (BS551113 is NAICS 551113, so 55), the sums are this project's, and every
  # summed series is `derived`. The cube's own "Total industries" is reproduced.
  #
  # Two choices, both visible in the payload's `crosswalk`:
  #   - 52, 53 and 55 are one IOIC aggregate, BS5B0. They separate only a level
  #     down, where BS5A000 is exactly other finance (BS52E000), real estate
  #     agents (BS531A00) and holding companies (BS551113). Owner-occupied
  #     dwellings (BS53C) sits outside BS5B0 and belongs to 53.
  #   - NP999999, "Other non-profit institutions serving households", embeds no
  #     NAICS code. It is kept as `unallocated`, never guessed into a sector.
  #
  # Measured before any tolerance was set: the members sum to Total industries
  # within 0.008% in all 156 complete geography-years; output is never below
  # value added in any sector or year; provinces + territories + "Canadian
  # territorial enclaves abroad" sum to Canada within 0.00001% (without the
  # enclaves, public administration falls 0.56% short). For 14 of the 26 years
  # 62, 81 and unallocated are blank, because a non-profit member is not
  # published for them — blank, never summed from the members that are.
  output_annual:
    pid: "36100488"
    output: output-annual.json
    frequency: annual
    measure: gross_output
    keep_status: true
    industry_column: { en: "Industry", fr: "Industries" }
    total: { member: "Total industries", code: T001 }
    labels_from: national-annual-current.json
    crosswalk:
      "11": [BS11A, BS113, BS114, BS115]
      "21": [BS210]
      "22": [BS220]
      "23": [BS23A, BS23B, BS23C, BS23D, BS23E]
      "31-33": [BS3A0]
      "41": [BS410]
      "44-45": [BS4A0]
      "48-49": [BS4B0]
      "51": [BS510]
      "52": [BS52B00, BS52E000, BS52410]
      "53": [BS531A00, BS53110, BS53B00, BS53C]
      "54": [BS540]
      "55": [BS551113]
      "56": [BS560]
      "61": [BS610, NP61000, GS610]
      "62": [BS620, NP62400, NP621000, GS620]
      "71": [BS710, NP71000]
      "72": [BS720]
      "81": [BS810, NP81310, NP813A00]
      "91": [GS911, GS912, GS913, GS914]
      unallocated: [NP999999]
    verify:
      provinces: true
      extra_geos: ["Canadian territorial enclaves abroad"]
      identities:
        - parts: ["11", "21", "22", "23", "31-33", "41", "44-45", "48-49", "51", "52", "53",
                  "54", "55", "56", "61", "62", "71", "72", "81", "91", "unallocated"]
          total: T001
          tolerance_pct: 0.01
      provinces_sum_to_canada: { tolerance_pct: 0.001, include_extra_geos: true }
      not_below:
        - file: national-annual-current.json
          label: gross output is never below value added

  provincial_annual:
    pid: "36100711"
    output: provincial-annual.json
    frequency: annual
    measure: gdp_chained
    scope: provincial
    filters:
      Prices: "Chained (2017) dollars"
    # No "Canada" member exists in this cube — it is provinces and territories
    # only. National totals come from the monthly cube above.
    # Also carries members absent from the monthly cube (4AA, 51A, 53A); the
    # code allowlist in `sectors` excludes them automatically.
