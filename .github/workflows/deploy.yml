name: Build (and deploy to Pages on demand)

# Builds web/ and publishes it. The pipeline does NOT run here: the data bundle
# is committed, so a deploy is a pure build of what is already in the repo.
# That is deliberate — CI reaching out to canada.ca and StatCan on every push
# would be both impolite and a way to get a different site from the same commit.
#
# To refresh the data, run `python run.py` locally and commit the result. The
# diff is the review.
#
# PAGES IS NOT ENABLED YET. The repo is private, and Pages needs a public repo
# on the Free plan. So the `build` job runs on every push as ordinary CI —
# typecheck plus a real production build, which is worth having on its own —
# and the `deploy` job is held behind a manual trigger so it cannot fail on
# push against a Pages site that does not exist.
#
# WHEN YOU ENABLE PAGES: make the repo public, set Settings → Pages → Source to
# "GitHub Actions", then delete the `if:` on the deploy job below so it runs
# automatically. Nothing else needs to change.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One concurrent deploy; a queued run supersedes an older one rather than
# racing it. `cancel-in-progress: false` lets an in-flight deploy finish so
# Pages is never left mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile,
      # so a transitive release cannot change what gets deployed.
      - run: npm ci
        working-directory: web

      - run: npx tsc --noEmit
        working-directory: web

      # A project site is served from /<repo>/, so the build needs that prefix.
      # Derived from the repo name rather than hardcoded, so a rename or a fork
      # does not silently ship a site whose assets all 404.
      - name: Build
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    # Remove this line once Pages is enabled — see the header.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
